name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The database suites must run in CI, not skip. A suite that silently passes
    # because it connected to nothing is the same failure mode as a green run
    # against stale compiled code, and there is no local equivalent to notice.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: been_there
          POSTGRES_PASSWORD: been_there_local_only
          POSTGRES_DB: been_there
        ports:
          # 55432 locally too, so a CI run and a developer run use one string.
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U been_there"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://been_there:been_there_local_only@127.0.0.1:55432/been_there

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Validates this very workflow. It must be early: a workflow that does
      # not parse is rejected in 0s and never starts, so the real gate is
      # `make check` before the push and this is the belt to its braces.
      - name: Check the workflow file
        run: node scripts/dev/check-workflow.mjs

      # The solution build typechecks every package's source through the project
      # graph. It is the check that catches a package added without being wired
      # into tsconfig.json, which `tsc -p` on a single package would not.
      - name: Typecheck
        run: npm run typecheck

      # The test projects are not in the solution graph, so `tsc --build` never
      # opens them and a test file that does not compile is invisible to the
      # step above. Seven such errors sat in test projects for a session while
      # `npm run typecheck` reported zero.
      - name: Typecheck tests
        run: node scripts/dev/typecheck-tests.mjs

      - name: Test
        run: npm test

      - name: Check documentation links
        run: node scripts/check-doc-links.mjs

      - name: Check research tool
        run: node scripts/research/search.mjs --help > /dev/null

      # Compiled output beside its source makes the loader prefer the .js, so
      # the suite silently runs stale code. This has happened here once already.
      - name: Check for stale artefacts
        run: node scripts/dev/check-stale-artifacts.mjs

      - name: Check the lockfile covers every workspace package
        run: node scripts/dev/check-workspace-lockfile.mjs

      # The schema has to exist before the suites run, or every database test
      # skips on a missing table and the job is green for the wrong reason.
      - name: Migrate
        run: node packages/database/scripts/migrate.mjs

      # The dataset is built by running the domain, so the only thing that proves
      # the loader still works is loading it. It was broken for a long time with
      # nothing red: `make setup` — the first command a newcomer runs — failed,
      # and no step here touched it. This writes the *shared* database; the suites
      # above each create and drop their own, so it cannot collide with them.
      - name: Seed the development dataset
        run: node packages/seed/scripts/load.mjs

  # The client mirrors rules the server enforces, and a mirror that drifts is
  # worse than no mirror: the client offers an action the server refuses. These
  # tests are the only thing keeping the two in step.
  client:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test the client safety gate
        run: cd client/BeenThereKit && swift test

      # The package declares iOS 17 as a platform, so compiling for the simulator
      # is what proves the source is actually iOS-compatible rather than merely
      # building on the Mac.
      #
      # The whole client source set, not one file. Naming `ClientGate.swift`
      # compiled a single file of nine and left the other eight — the API client,
      # the decoding shim and every view model — outside CI entirely, so a client
      # that did not compile was still green. The glob is what makes a new source
      # file part of this gate by existing.
      - name: Compile for the iOS simulator
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          export SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios17.0-simulator -emit-module -module-name BeenThereKit client/BeenThereKit/Sources/BeenThereKit/*.swift -o "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/BeenThereKit.swiftmodule"
