name: BeenThereIos
options:
  bundleIdPrefix: dev.beenthere
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # The service a developer runs speaks plain HTTP on the local network;
    # ATS would refuse it before the connection screen could answer. Scoped
    # to local networking so a real https deployment gains nothing to turn off.
    INFOPLIST_KEY_NSAppTransportSecurity_LocalNetworking: YES
targets:
  BeenThereIos:
    type: application
    platform: iOS
    sources:
      - path: Sources/BeenThereIos
    dependencies:
      - package: BeenThereViews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.beenthere.BeenThereIos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/BeenThereIos/Info.plist
        # Signing is a decision a person makes with their own Apple ID: the
        # team is left unset rather than guessed. Xcode fills it on first
        # device build; the simulator needs no signature at all.
        CODE_SIGN_STYLE: Automatic
  BeenThereIosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/BeenThereIosUITests
    dependencies:
      - target: BeenThereIos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.beenthere.BeenThereIosUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BeenThereIos
schemes:
  BeenThereIos:
    build:
      targets:
        BeenThereIos: all
        BeenThereIosUITests: [test]
    test:
      targets:
        - BeenThereIosUITests
      environmentVariables:
        # The UI test drives the app against the service `make demo` starts, as
        # one of the eight seeded people. These are the seeder's own published
        # development credentials — it prints them on every load — so putting
        # them here grants no access that reading the repository does not. A
        # device run points the app at the Mac's LAN address instead.
        BEEN_THERE_BASE_URL: http://127.0.0.1:8787
        BEEN_THERE_DEMO_CONTACT: u-avery@been-there.test
        # All eight seeded people, in the order `make seed` prints them. The UI
        # suite signs in once per test and the service allows five sign-ins per
        # account per fifteen minutes, so each test takes a different person
        # rather than all three spending one account's budget.
        BEEN_THERE_DEMO_CONTACTS: u-avery@been-there.test,u-blair@been-there.test,u-frankie@been-there.test,u-riley@been-there.test,u-ellis@been-there.test,u-sasha@been-there.test,u-casey@been-there.test,u-devon@been-there.test
        BEEN_THERE_DEMO_PASSWORD: been-there-demo-42
packages:
  BeenThereViews:
    path: ../BeenThereViews
